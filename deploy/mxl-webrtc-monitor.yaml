apiVersion: v1
kind: ConfigMap
metadata:
  name: mxl-webrtc-monitor
  labels:
    app: mxl-webrtc-monitor
data:
  MONITOR_CHANNELS: "4"
  ENCODER: auto
  NMOS_DNS_SD: "false"
  NMOS_REGISTRY_PORT: "3210"
  WEB_PORT: "8100"
  NMOS_PORT: "3242"
  STATE_DIR: /config
  SHUTDOWN_TIMEOUT_S: "10"
  MXL_CLEANUP_ON_EXIT: "true"
  NMOS_SEED: sport-sa-monitor
  NMOS_LABEL: sport-sa monitor
  NMOS_TAGS: '{"urn:x-srf:production":["sport-sa"],"urn:x-srf:function":["monitor"]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-webrtc-monitor
  labels:
    app: mxl-webrtc-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mxl-webrtc-monitor
  template:
    metadata:
      labels:
        app: mxl-webrtc-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      # Host network: browsers send ICE to the node IP. Several monitors on one
      # node each need their own WEB_PORT, NMOS_PORT and MediaMTX ports.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      # Pin one replica to a media node in the platform overlay:
      # nodeName: media-node-a
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [1000]
        fsGroup: 1000
      # Optional GPU. Uncomment together with the device request below.
      # runtimeClassName: nvidia
      containers:
        - name: monitor
          image: ghcr.io/leeo86/mxl-webrtc-monitor:1.3.0
          envFrom:
            - configMapRef:
                name: mxl-webrtc-monitor
          env:
            - name: HOST_ID
              value: monitor
            - name: MXL_DOMAIN_SCAN_PATH
              value: /Volumes/mxl
            - name: NMOS_REGISTRY_ADDRESS
              value: "10.0.0.10"
            - name: NMOS_HOST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MONITOR_PUBLIC_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Browser bases on the HTTPS ingress. ICE stays on MONITOR_PUBLIC_IP.
            # - name: PREVIEW_WHEP_URL
            #   value: https://mon1-whep.small.mxl.ipla.media.int
            # - name: PREVIEW_HLS_URL
            #   value: https://mon1-hls.small.mxl.ipla.media.int
            # Shared mode: publish to the platform's MediaMTX and start none here.
            # - name: PREVIEW_PUBLISH_URL
            #   value: rtsp://mxl-mediamtx.mxl-platform.svc:8554
            # - name: PREVIEW_PATH_PREFIX
            #   value: sport-sa/monitor
          # The built-in MediaMTX (own mode) serves WHEP, HLS and ICE from this container.
          ports:
            - name: web
              containerPort: 8100
            - name: nmos
              containerPort: 3242
            - name: whep
              containerPort: 8889
            - name: hls
              containerPort: 8888
            - name: ice
              containerPort: 8189
              protocol: UDP
            - name: mediamtx-metrics
              containerPort: 9998
          volumeMounts:
            - name: mxl
              mountPath: /Volumes/mxl
              readOnly: true
            - name: mediamtx-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            # limits:
            #   nvidia.com/gpu: 1
      volumes:
        - name: mxl
          hostPath:
            path: /Volumes/mxl
            type: Directory
        - name: mediamtx-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mxl-webrtc-monitor
  labels:
    app: mxl-webrtc-monitor
spec:
  clusterIP: None
  selector:
    app: mxl-webrtc-monitor
  ports:
    - name: web
      port: 8100
      targetPort: web
    - name: mediamtx-metrics
      port: 9998
      targetPort: mediamtx-metrics
