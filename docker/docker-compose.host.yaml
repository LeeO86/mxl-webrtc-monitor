# One host of a real platform. The MXL root is the shared tmpfs, read-only here.
# Set NMOS_REGISTRY_ADDRESS to the facility registry. A second monitor on the same
# host needs different WEB_PORT, NMOS_PORT, and MediaMTX ports. The monitor runs its
# built-in MediaMTX unless PREVIEW_PUBLISH_URL names a shared one.

services:
  # The monitor runs as uid 1000 and its image has no /config: a new named volume is owned by
  # root and the monitor exits 75 (cannot write mediamtx.yml). This one-shot gives it to uid 1000.
  config-owner:
    image: ghcr.io/leeo86/mxl-webrtc-monitor:1.3.0
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/config"]
    volumes:
      - mtx-config:/config

  monitor:
    image: ghcr.io/leeo86/mxl-webrtc-monitor:1.3.0
    network_mode: host
    depends_on:
      config-owner:
        condition: service_completed_successfully
    environment:
      MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
      NMOS_REGISTRY_ADDRESS: ${NMOS_REGISTRY_ADDRESS:-}
      NMOS_REGISTRY_PORT: ${NMOS_REGISTRY_PORT:-3210}
      NMOS_QUERY_ADDRESS: ${NMOS_QUERY_ADDRESS:-}
      NMOS_QUERY_PORT: ${NMOS_QUERY_PORT:-}
      NMOS_DNS_SD: "false"
      NMOS_SEED: ${NMOS_SEED:-monitor}
      NMOS_LABEL: ${NMOS_LABEL:-}
      NMOS_HOST_ADDRESS: ${NMOS_HOST_ADDRESS:-}
      MONITOR_PUBLIC_IP: ${MONITOR_PUBLIC_IP:-}
      STATE_DIR: /config
      SHUTDOWN_TIMEOUT_S: "10"
      MXL_CLEANUP_ON_EXIT: "true"
      ENCODER: ${ENCODER:-auto}
      MONITOR_CHANNELS: ${MONITOR_CHANNELS:-4}
      PREVIEW_PUBLISH_URL: ${PREVIEW_PUBLISH_URL:-}
      PREVIEW_PATH_PREFIX: ${PREVIEW_PATH_PREFIX:-}
      PREVIEW_WHEP_URL: ${PREVIEW_WHEP_URL:-}
      PREVIEW_HLS_URL: ${PREVIEW_HLS_URL:-}
    volumes:
      - /Volumes/mxl:/Volumes/mxl:ro
      - mtx-config:/config

volumes:
  mtx-config:
